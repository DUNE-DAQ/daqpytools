# Check compliance with defined linting rules using ruff and taplo.

name: Lint with Ruff and Taplo

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

      - run: ruff check --exit-non-zero-on-fix
      - run: ruff format

      - name: Install Taplo CLI
        run: |
          curl -sSf https://taplo.tamasfe.dev/install.sh | sh
          echo "$HOME/.taplo/bin" >> $GITHUB_PATH
      - name: Check TOML formatting with Taplo
        run: taplo fmt --check --config pyproject.toml
