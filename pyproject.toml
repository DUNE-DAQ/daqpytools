[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61.0"]

[project]
dependencies = [
  "click",
  "kafka-python",
  "pytz",
  "rich",
  "sh",
]
description = "Python utils to simplify DAQ development."
name = "daqpytools"
readme = "docs/README.md"
requires-python = ">=3.10"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daqpytools.logging" = ["log_format.ini"]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "pytest-cov",
]
test = ["pytest", "pytest-mypy", "pytest-cov", "types-pytz"]

[project.scripts]
daqpytools-logging-demonstrator = "daqpytools.apps.logging_demonstrator:main"


# Stricter linting rules than the standard (daq-deliverables #196); this is fine

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["D205", "D100", "D104"]
pydocstyle.convention = "google"
select = [
  "D",
  "E",
  "F",
  "I",
  "UP",
  "RUF",
  "S",
  "N",
  "ERA",
  "B",
  "C4",
  "A",
  "RET",
  "T20",
  "ISC",
  "G",
  "TRY",
  "T",
  "ANN",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "D104", "S101", "ANN201"]

[tool.pytest.ini_options]
addopts = "-v -p no:warnings --cov=daqpytools --cov=src/daqpytools tests/"

[tool.coverage.run]
omit = ["tests/*"]
