[build-system]
build-backend = "setuptools.build_meta"
requires      = [ "setuptools >= 61.0" ]

[project]
dependencies = [
    "click==8.1.7",
    "kafka-python==2.0.2",
    "pytz==2024.2",
    "rich==13.9.4",
    "sh==2.1.0",
]
description = "Python utils to simplify DAQ development."
name = "daqpytools"
readme = "docs/README.md"
requires-python = ">=3.10"
version = "0.1.0"

[tool.setuptools]
package-dir = { "" = "src" }

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "isort",
    "black",
    "pytest-cov",
    "pytest-mypy",
    "taplo",
]

[project.scripts]
daqpytools-logging-demonstrator = "daqpytools.apps.__main_logging_demonstrator__:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore                = [ "D205", "D100", "D104" ]
pydocstyle.convention = "google"
select                = [ "D", "E", "F", "I", "UP", "RUF", "ANN" ]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "D100", "D103", "D104", "S101", "ANN201" ]

[tool.black]
force-exclude = '''
/(
    \.git
  | \.github
  | \.ruff_cache
)/
'''
line-length = 88
skip-magic-trailing-comma = true
target-version = [ "py310", "py311", "py312", "py313" ]

[tool.mypy]
ignore_missing_imports = true
mypy_path              = "src"

[tool.pytest.ini_options]
addopts = "-v --mypy -p no:warnings --cov=. --cov-report=html --doctest-modules --ignore=docs/ --ignore=src/daqpytools/apps/"
testpaths = ["tests"]
norecursedirs = [".git", ".github", "venv"]

[tool.coverage.run]
omit = [ "tests/*", "scripts/*" ]
