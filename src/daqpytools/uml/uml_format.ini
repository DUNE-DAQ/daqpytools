[uml_class_style]
# UML class diagram styling
# Colors use hex notation or named colors
fill = #FFFDE7
stroke = #8B7355
font = Helvetica
fontsize = 10

[uml_relationships]
# UML relationship edge colors
inherit_color = #555555
uses_color = #555555

[uml_graph]
# UML graph layout and appearance
bg_color = white
rankdir = BT
pad = 0.5
nodesep = 0.6
ranksep = 0.9

[uml_links]
# GitHub linking for --generate-linkable
github_org = DUNE-DAQ
default_ref = develop

[uml_color_theme]
# Colors used by --color-by-directory, assigned in first-seen directory order
colors = #FFF4B8,#BFE8C2,#BFD7FF,#F6C3D5,#D7C6FF,#BFECEF,#FFD6A5,#D0D0D0,#C7E9B0,#F4B6C2,#E8DDB5,#C9E4DE,#F7C6A3,#D5E8D4,#F2C6DE,#C6D8FF,#E2F0CB,#FAD2E1,#BEE1E6,#F0E6EF

[cli]
# Command-line interface options
help_option_names = -h,--help